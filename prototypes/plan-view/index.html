<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hrobka Tutanchamona</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="app is-splash" id="app">
    <section class="intro" id="intro" aria-label="Úvodní obraz">
      <div class="introMapFrame" aria-hidden="true">
        <iframe class="introMap" id="introMap" title="Mapa Údolí králů" tabindex="-1" loading="eager" referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
      <div class="titleBlock">
        <h1 id="introTitle">Hrobka Tutanchamona</h1>
        <button class="introEnter" id="introEnter" type="button">Vstoupit</button>
      </div>
    </section>

    <section class="workspace" aria-label="Prohlídka KV62">
      <header class="topbar">
        <div>
          <h2><a class="appTitleLink" id="appTitleLink" href="#intro">Hrobka Tutanchamona</a></h2>
        </div>
        <nav class="tabs" id="filterTabs" aria-label="Filtr bodů v půdorysu"></nav>
        <button class="ghostButton" id="sourcesButton" type="button">Zdroje</button>
      </header>

      <section class="planStage" aria-label="Klikací půdorys hrobky">
        <div class="planCanvas" id="planCanvas"></div>
      </section>

      <aside class="detailPanel" aria-label="Detail vybraného bodu">
        <h2 id="detailTitle">KV62 shora</h2>
        <figure class="photoFrame" id="photoFrame" hidden>
          <img id="detailPhoto" alt="">
          <figcaption id="photoCaption"></figcaption>
        </figure>
        <p class="bodyText" id="detailBody"></p>
        <div class="sourceLine" id="detailSources"></div>
      </aside>
    </section>

    <section class="overlay" id="sourcesOverlay" aria-label="Zdroje">
      <div class="modal">
        <div class="modalHeader">
          <h2>Použité zdroje</h2>
          <button class="ghostButton" id="closeSourcesButton" type="button">Zavřít</button>
        </div>
        <div class="sourceGrid" id="sourceGrid"></div>
      </div>
    </section>

    <noscript>Tato varianta potřebuje zapnutý JavaScript, protože obsah načítá z externího JSON souboru.</noscript>
  </main>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
